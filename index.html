<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🛒 Lista zakupów — REMA 1000</title>
<style>
  :root { --red:#d9292f; --bg:#f6f6f4; --card:#fff; --text:#1a1a1a; --muted:#8d8d8d;
          --line:#f0f0f0; --tag:#eef2f7; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); padding-bottom:64px; }
  header { background:var(--red); color:#fff; padding:18px 18px 14px; position:sticky; top:0;
           z-index:10; box-shadow:0 2px 6px rgba(0,0,0,.12); }
  header h1 { font-size:1.3rem; }
  header .meta { font-size:.78rem; opacity:.9; margin-top:4px; }
  .tabs { display:flex; gap:6px; margin-top:12px; }
  .tab { flex:1; border:none; background:rgba(255,255,255,.18); color:#fff; font-family:inherit;
         font-size:.9rem; padding:9px 10px; border-radius:9px; cursor:pointer; }
  .tab.active { background:#fff; color:var(--red); font-weight:600; }
  .tab .n { opacity:.7; font-size:.8rem; }
  main { max-width:560px; margin:0 auto; padding:14px; }
  .row { display:flex; gap:8px; margin-bottom:12px; }
  .row input { flex:1; min-width:0; font-family:inherit; font-size:1rem; padding:12px 14px;
               border-radius:12px; border:1px solid #e0e0dd; background:#fff; }
  .row button { font-family:inherit; border:none; border-radius:12px; cursor:pointer;
                background:var(--red); color:#fff; font-weight:600; font-size:.95rem; padding:12px 16px; }
  .tools { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .tools button { font-family:inherit; font-size:.85rem; border:1px solid #e0e0dd; border-radius:12px;
                  padding:9px 13px; background:#fff; color:var(--text); cursor:pointer; }
  section { background:var(--card); border-radius:12px; padding:12px 16px; margin-bottom:12px;
            box-shadow:0 1px 3px rgba(0,0,0,.06); }
  section h2 { font-size:1rem; margin-bottom:2px; display:flex; align-items:center; gap:8px; }
  section h2 .n { font-size:.75rem; color:var(--muted); font-weight:400; margin-left:auto; }
  ul { list-style:none; }
  li { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line);
       font-size:1rem; }
  li:last-child { border-bottom:none; }
  input[type=checkbox] { width:20px; height:20px; accent-color:var(--red); flex-shrink:0; }
  li.done span { text-decoration:line-through; color:var(--muted); }
  .low { color:#b26a00; }
  .empty { color:var(--muted); font-style:italic; font-size:.9rem; }
  .dot { width:14px; height:14px; border-radius:50%; background:#e3e3e3; flex-shrink:0; }
  li .del { margin-left:auto; border:none; background:transparent; color:#cfcfcf; font-size:1rem;
            cursor:pointer; padding:4px 7px; border-radius:6px; }
  li .del:hover { background:#fdecec; color:var(--red); }
  li .add { margin-left:auto; border:none; background:#eef7ee; color:#1f7a3d; font-size:1.1rem;
            font-weight:700; cursor:pointer; padding:3px 11px; border-radius:8px; }
  li .add:hover { background:#d7efdd; }
  .banner { background:#fff8e1; border:1px solid #f0e0a8; border-radius:12px; padding:10px 14px;
            margin-bottom:12px; font-size:.85rem; color:#6b5a12; }
  li.emptyrow span { color:#b9b9b9; }
  .qty { margin-left:auto; display:flex; align-items:center; gap:6px; }
  .qty button { font-family:inherit; border:1px solid #e0e0dd; background:#fff; border-radius:9px;
                width:36px; height:34px; font-size:1.05rem; line-height:1; cursor:pointer; }
  .qty button:active { background:#f2f2f0; }
  .qty button.qz { width:auto; padding:0 9px; font-size:.8rem; color:#9a9a9a; }
  .qty b { min-width:44px; text-align:center; font-size:.95rem; font-variant-numeric:tabular-nums; }
  .allbox { display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--muted);
            margin-bottom:10px; }
  footer { max-width:560px; margin:0 auto; padding:4px 16px 24px; color:var(--muted);
           font-size:.82rem; line-height:1.5; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:18px; background:#1a1a1a;
           color:#fff; font-size:.85rem; padding:10px 14px; border-radius:10px; opacity:0;
           transition:opacity .2s; pointer-events:none; max-width:90%; text-align:center; z-index:50; }
  .toast.show { opacity:.95; }
</style>
</head>
<body>
<header>
  <h1>🛒 Lista zakupów</h1>
  <div class="meta" id="meta">wczytywanie…</div>
  <div class="tabs">
    <button class="tab active" data-tab="list">Lista <span class="n" id="c-list">–</span></button>
    <button class="tab" data-tab="sugg">Sugestie <span class="n" id="c-sugg">–</span></button>
    <button class="tab" data-tab="stock">Stan</button>
  </div>
</header>
<main>
  <form class="row" id="form" autocomplete="off">
    <input id="newitem" placeholder="dodaj pozycję… (albo „kupiłem mleko”)">
    <button type="submit">Dodaj</button>
  </form>
  <div class="tools">
    <button type="button" id="reload">Odśwież</button>
  </div>
  <div id="pane-list"></div>
  <div id="pane-sugg" hidden></div>
  <div id="pane-stock" hidden></div>
</main>
<footer>
  <p>Zmiany idą wprost do bazy (Supabase) — ta sama lista co w Telegramie.
  Odhaczenie = kupione, ✕ = usuń, + = dodaj sugestię do listy.</p>
  <p style="margin-top:8px">Wygenerowano 2026-09-20 23:12</p>
</footer>
<div id="toast" class="toast"></div>
<script>
const CONFIG = {"url": "https://nojbfvwmnjkwddrzwrxw.supabase.co/rest/v1", "key": "sb_publishable_nWeOrV3lF_pKUEaUIXm6Lw_ALIPRoBl", "pass": "cebula-bulka-6ca6"};
const AISLES = {"frukt_og_gront": "🥦 Owoce i warzywa", "brod": "🍞 Pieczywo", "meieri": "🥛 Nabiał", "palegg": "🥪 Wędliny i sery", "kjott_fisk": "🥩 Mięso i ryby", "torrvarer": "🍝 Suchy prowiant", "frys": "❄️ Mrożonki", "snacks_drikke": "🍫 Przekąski i napoje", "husholdning": "🧹 Chemia i higiena", "kassa": "🧾 Kasa", "inne": "📦 Inne"};
const ORDER = ["frukt_og_gront", "brod", "meieri", "palegg", "kjott_fisk", "torrvarer", "frys", "snacks_drikke", "husholdning", "kassa", "inne"];
</script>
<script>
  const $ = s => document.querySelector(s);
  const toast = document.getElementById('toast');
  function showMsg(m) {
    toast.textContent = m; toast.classList.add('show');
    clearTimeout(showMsg._t);
    showMsg._t = setTimeout(() => toast.classList.remove('show'), 2600);
  }
  const PASSPHRASE = CONFIG.pass;
  let busy = false;

  async function api(path, opts) {
    const r = await fetch(CONFIG.url + path, Object.assign({
      headers: {apikey: CONFIG.key, Authorization: 'Bearer ' + CONFIG.key,
                'Content-Type': 'application/json'}
    }, opts || {}));
    if (!r.ok) {
      let msg = 'HTTP ' + r.status;
      try { const j = await r.json(); msg = j.message || j.error || msg; } catch (e) {}
      throw new Error(msg);
    }
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  }

  async function act(action, name, store) {
    if (busy) return;
    busy = true;
    try {
      const res = await api('/rpc/zk_action', {
        method: 'POST',
        body: JSON.stringify({p_pass: PASSPHRASE, p_action: action, p_name: name,
                              p_store: store || null})
      });
      if (res && res.ok === false) showMsg(res.error || 'błąd');
      await draw();
    } catch (e) { showMsg('błąd: ' + e.message); }
    finally { busy = false; }
  }

  function li(it, kind) {
    const el = document.createElement('li');
    const lead = document.createElement('input');
    lead.type = 'checkbox';
    lead.addEventListener('change', () => {
      if (lead.checked) act('bought', it.name, 'strona');
      else el.classList.toggle('done', lead.checked);
    });
    const sp = document.createElement('span');
    sp.textContent = it.name;
    if (it.status === 'low') sp.className = 'low';
    const btn = document.createElement('button');
    if (kind === 'del') {
      btn.className = 'del'; btn.textContent = '✕'; btn.title = 'Usuń z listy';
      btn.addEventListener('click', () => act('remove', it.name));
    } else {
      btn.className = 'add'; btn.textContent = '+'; btn.title = 'Dodaj do listy';
      btn.addEventListener('click', () => act('add', it.name));
    }
    el.append(lead, sp, btn);
    return el;
  }

  function section(title, items, kind) {
    const s = document.createElement('section');
    const h = document.createElement('h2');
    h.textContent = title;
    const cnt = document.createElement('span'); cnt.className = 'n'; cnt.textContent = items.length;
    h.appendChild(cnt);
    const ul = document.createElement('ul');
    if (!items.length) {
      const e = document.createElement('li');
      const sp = document.createElement('span'); sp.className = 'empty'; sp.textContent = '(pusto)';
      e.appendChild(sp); ul.appendChild(e);
    } else items.forEach(it => ul.appendChild(li(it, kind)));
    s.append(h, ul);
    return s;
  }

  function grouped(items, kind) {
    const frag = document.createDocumentFragment();
    const groups = {};
    items.forEach(it => { const k = it.aisle || 'inne'; (groups[k] = groups[k] || []).push(it); });
    const keys = ORDER.filter(k => groups[k]).concat(Object.keys(groups).filter(k => !ORDER.includes(k)));
    if (!keys.length) frag.appendChild(section('—', [], kind));
    keys.forEach(k => frag.appendChild(section(AISLES[k] || k, groups[k], kind)));
    return frag;
  }

  async function draw() {
    let rows;
    try {
      rows = await api('/items?select=name,aisle,status,source&status=in.(need,low)&order=name');
    } catch (e) { showMsg('brak połączenia: ' + e.message); return; }
    const lista = rows.filter(r => r.source === 'manual');
    const sugestie = rows.filter(r => r.source !== 'manual');
    $('#meta').textContent = 'REMA 1000 · układ sklepu · ' + new Date().toLocaleTimeString('pl-PL').slice(0, 5);
    $('#c-list').textContent = lista.length;
    $('#c-sugg').textContent = sugestie.length;
    $('#pane-list').replaceChildren(grouped(lista, 'del'));
    $('#pane-sugg').replaceChildren(grouped(sugestie, 'add'));
  }

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    ['list', 'sugg', 'stock'].forEach(k => {
      const p = $('#pane-' + k);
      if (p) p.hidden = (t.dataset.tab !== k);
    });
  }));

  // ── zakładka „Stan" ─────────────────────────────────────────────────────
  let stockRows = [];
  let showAll = false;
  const fmtQty = q => {
    const n = Number(q) || 0;
    return n === 0 ? '0' : (n % 1 === 0 ? String(n) : n.toFixed(2).replace(/0$/, ''));
  };
  async function setStock(name, qty) {
    try {
      const res = await api('/rpc/zk_stock', {method: 'POST',
        body: JSON.stringify({p_pass: PASSPHRASE, p_name: name, p_qty: qty})});
      if (res && res.ok === false) showMsg(res.error || 'błąd');
      const it = stockRows.find(r => r.name === name);
      if (it) it.qty = Number(res && res.qty !== undefined ? res.qty : qty);
      renderStock();
    } catch (e) { showMsg('błąd: ' + e.message); }
  }
  function stockRow(it) {
    const el = document.createElement('li');
    if (!(Number(it.qty) > 0)) el.classList.add('emptyrow');
    const sp = document.createElement('span');
    sp.textContent = it.name;
    const ctl = document.createElement('div');
    ctl.className = 'qty';
    const mk = (txt, cls, fn) => { const b = document.createElement('button');
      b.textContent = txt; b.className = cls; b.addEventListener('click', fn); return b; };
    const val = document.createElement('b');
    val.textContent = fmtQty(it.qty);
    ctl.append(
      mk('−', 'qn', () => setStock(it.name, Math.max(0, +(Number(it.qty) - 0.25).toFixed(2)))),
      val,
      mk('+', 'qp', () => setStock(it.name, +(Number(it.qty) + 0.25).toFixed(2))),
      mk('0', 'qz', () => setStock(it.name, 0))
    );
    el.append(sp, ctl);
    return el;
  }
  function renderStock() {
    const pane = $('#pane-stock');
    if (!pane) return;
    pane.replaceChildren();
    const box = document.createElement('label');
    box.className = 'allbox';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = showAll;
    cb.addEventListener('change', () => { showAll = cb.checked; renderStock(); });
    box.append(cb, document.createTextNode('pokaż też to, czego nie ma'));
    pane.appendChild(box);
    const rows = stockRows.filter(r => showAll || Number(r.qty) > 0);
    const groups = {};
    rows.forEach(r => { const k = r.category || 'inne'; (groups[k] = groups[k] || []).push(r); });
    const keys = ORDER.filter(k => groups[k]).concat(Object.keys(groups).filter(k => !ORDER.includes(k)));
    if (!keys.length) {
      const s = document.createElement('section');
      s.innerHTML = '<h2>—</h2><ul><li><span class="empty">(pusto)</span></li></ul>';
      pane.appendChild(s);
    }
    keys.forEach(k => {
      const s = document.createElement('section');
      const h = document.createElement('h2');
      h.textContent = AISLES[k] || k;
      const n = document.createElement('span'); n.className = 'n'; n.textContent = groups[k].length;
      h.appendChild(n);
      const ul = document.createElement('ul');
      groups[k].sort((a, b) => (Number(b.qty) > 0) - (Number(a.qty) > 0) || a.name.localeCompare(b.name));
      groups[k].forEach(r => ul.appendChild(stockRow(r)));
      s.append(h, ul);
      pane.appendChild(s);
    });
  }
  async function drawStock() {
    try {
      stockRows = await api('/stock?select=name,qty,category,source&order=name') || [];
    } catch (e) { showMsg('brak stanu: ' + e.message); return; }
    renderStock();
  }

  $('#reload').addEventListener('click', () => { draw(); drawStock(); });
  draw();
  drawStock();
  setInterval(() => { draw(); drawStock(); }, 45000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { draw(); drawStock(); }
  });

  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#newitem').value.trim();
    if (!v) return;
    $('#newitem').value = '';
    const t = v.replace(/^dodaj\s+/i, '');
    if (/^(kupi(ł|le)m|kupione)/i.test(t)) act('bought', t.replace(/^(kupi(ł|le)m|kupione)\s*/i, ''), 'strona');
    else if (/^(skończyło się|nie mam)/i.test(t)) act('out', t.replace(/^(skończyło się|nie mam)\s*/i, ''));
    else act('add', t);
  });
  $('#reload').addEventListener('click', draw);
  draw();
  setInterval(draw, 45000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) draw(); });
</script>
</body>
</html>
